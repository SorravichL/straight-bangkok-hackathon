<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>API console · strAIght Up starter</title>
<style>
  :root {
    --bg: #10100f; --panel: #1a1a18; --line: #2e2e2a;
    --ink: #edeae2; --dim: #8b8880; --live: #b8e02c; --warn: #e0642c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 64px; background: var(--bg); color: var(--ink);
    font: 14px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 20px; }
  .sub a { color: var(--live); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  button {
    padding: 8px 14px; border-radius: 6px; cursor: pointer; border: 0;
    background: var(--live); color: #10100f; font: inherit; font-weight: 600;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .card { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); flex-wrap: wrap; }
  .verb { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #2e2e2a; }
  .path { font-weight: 600; }
  .what { color: var(--dim); font-size: 12px; flex: 1; min-width: 140px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--live); border-color: var(--live); }
  .pill.bad { color: var(--warn); border-color: var(--warn); }
  .body { padding: 12px; display: none; }
  .card.open .body { display: block; }
  textarea {
    width: 100%; min-height: 74px; padding: 10px; resize: vertical; font: inherit;
    background: #131312; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  }
  pre {
    margin: 10px 0 0; padding: 10px; max-height: 300px; overflow: auto;
    background: #131312; border: 1px solid var(--line); border-radius: 6px;
    white-space: pre-wrap; word-break: break-word; font-size: 12.5px;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin: 8px 0 4px; }
  input[type=file] { font: inherit; font-size: 12px; color: var(--dim); }
  audio { width: 100%; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>API console</h1>
  <p class="sub">Verify every endpoint before you need it. &nbsp;·&nbsp; <a href="/">back to demo</a></p>

  <div class="bar">
    <button id="runall">Run all safe checks</button>
    <button id="expand" class="ghost">Expand all</button>
  </div>

  <div id="cards"></div>
</main>

<script>
// Each entry describes one endpoint: how to call it and what a smoke test sends.
// `safe: true` means "Run all" will call it (cheap / no side effects worth caring about).
const ENDPOINTS = [
  {
    id: "health", verb: "GET", path: "/api/health", safe: true,
    what: "Are the API keys present? No network call, instant.",
  },
  {
    id: "models", verb: "GET", path: "/api/models", safe: true,
    what: "Which models can this key actually call? Check OPENAI_MODEL is valid.",
  },
  {
    id: "chat", verb: "POST", path: "/api/chat", safe: true,
    what: "Text in, text out. Streams unless stream:false.",
    body: { message: "Reply with exactly: pipeline ok", stream: false },
  },
  {
    id: "chatjson", verb: "POST", path: "/api/chat", safe: true,
    what: "JSON mode — forces machine-readable output for classify/extract.",
    body: { message: "Classify the sentiment of 'this is great'. Keys: sentiment, confidence.", json: true, stream: false },
  },
  {
    id: "moderate", verb: "POST", path: "/api/moderate", safe: true,
    what: "Safety classification. Relevant to a trust & safety brief.",
    body: { input: "I want to hurt someone." },
  },
  {
    id: "speak", verb: "POST", path: "/api/speak", safe: false, audio: true,
    what: "Text in, streamed mp3 out. Costs ElevenLabs credits.",
    body: { text: "Pipeline check complete." },
  },
  {
    id: "vision", verb: "POST", path: "/api/vision", safe: false, image: true,
    what: "Image + question in, text out. Pick a file below.",
    body: { prompt: "Describe this image in one sentence." },
  },
  {
    id: "listen", verb: "POST", path: "/api/listen", safe: false, record: true,
    what: "Audio in, transcript out. Record a clip below.",
  },
];

const cards = document.getElementById("cards");

for (const ep of ENDPOINTS) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="head">
      <span class="verb">${ep.verb}</span>
      <span class="path">${ep.path}</span>
      <span class="what">${ep.what}</span>
      <span class="pill" data-pill>idle</span>
    </div>
    <div class="body">
      ${ep.body ? `<label>request body (JSON)</label>
        <textarea data-body>${JSON.stringify(ep.body, null, 2)}</textarea>` : ""}
      ${ep.image ? `<label>image file</label><input type="file" accept="image/*" data-file />` : ""}
      ${ep.record ? `<label>microphone</label><button class="ghost" data-rec>Start recording</button>` : ""}
      <div style="margin-top:10px"><button data-send>Send</button></div>
      <pre data-out>—</pre>
      ${ep.audio ? `<audio controls data-audio hidden></audio>` : ""}
    </div>`;
  cards.appendChild(el);
  wire(ep, el);
}

function wire(ep, el) {
  const pill = el.querySelector("[data-pill]");
  const out = el.querySelector("[data-out]");
  const bodyEl = el.querySelector("[data-body]");
  const fileEl = el.querySelector("[data-file]");
  const audioEl = el.querySelector("[data-audio]");

  el.querySelector(".head").onclick = () => el.classList.toggle("open");

  const setPill = (text, cls) => { pill.textContent = text; pill.className = "pill " + (cls || ""); };

  async function send() {
    el.classList.add("open");
    setPill("running…");
    out.textContent = "…";
    const started = performance.now();
    try {
      const res = await call(ep, { bodyEl, fileEl, audioEl });
      const ms = Math.round(performance.now() - started);
      setPill(`${res.status} · ${ms}ms`, res.ok ? "ok" : "bad");
      out.textContent = res.text;
    } catch (err) {
      setPill("error", "bad");
      out.textContent = String(err.message || err);
    }
  }

  el.querySelector("[data-send]").onclick = send;
  ep._run = send;

  if (ep.record) setupRecorder(el, ep);
}

async function call(ep, { bodyEl, fileEl, audioEl }) {
  // --- GET endpoints ---
  if (ep.verb === "GET") {
    const r = await fetch(ep.path);
    return { ok: r.ok, status: r.status, text: pretty(await r.text()) };
  }

  // --- audio upload (recorded blob attached by the recorder) ---
  if (ep.record) {
    if (!ep._blob) throw new Error("Record a clip first.");
    const r = await fetch(ep.path, {
      method: "POST",
      headers: { "Content-Type": ep._blob.type || "audio/webm" },
      body: ep._blob,
    });
    return { ok: r.ok, status: r.status, text: pretty(await r.text()) };
  }

  const body = JSON.parse(bodyEl.value);

  // --- image: read the chosen file into a data URL ---
  if (ep.image) {
    if (!fileEl.files[0]) throw new Error("Choose an image file first.");
    body.image = await toDataURL(fileEl.files[0]);
  }

  const r = await fetch(ep.path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  // --- audio response: play it instead of printing bytes ---
  if (ep.audio && r.ok) {
    const blob = await r.blob();
    audioEl.src = URL.createObjectURL(blob);
    audioEl.hidden = false;
    audioEl.play().catch(() => {});
    return { ok: true, status: r.status, text: `audio/mpeg · ${(blob.size / 1024).toFixed(1)} KB — playing below` };
  }

  return { ok: r.ok, status: r.status, text: pretty(await r.text()) };
}

function setupRecorder(el, ep) {
  const btn = el.querySelector("[data-rec]");
  let rec, chunks = [];
  btn.onclick = async (e) => {
    e.stopPropagation();
    if (rec && rec.state === "recording") {
      rec.stop();
      btn.textContent = "Start recording";
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      rec = new MediaRecorder(stream);
      chunks = [];
      rec.ondataavailable = (ev) => chunks.push(ev.data);
      rec.onstop = () => {
        ep._blob = new Blob(chunks, { type: rec.mimeType });
        stream.getTracks().forEach((t) => t.stop());
        el.querySelector("[data-out]").textContent =
          `recorded ${(ep._blob.size / 1024).toFixed(1)} KB — press Send to transcribe`;
      };
      rec.start();
      btn.textContent = "Stop recording";
    } catch (err) {
      el.querySelector("[data-out]").textContent = "Microphone blocked: " + err.message;
    }
  };
}

const toDataURL = (file) => new Promise((ok, no) => {
  const fr = new FileReader();
  fr.onload = () => ok(fr.result);
  fr.onerror = no;
  fr.readAsDataURL(file);
});

function pretty(text) {
  try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text; }
}

document.getElementById("runall").onclick = async (e) => {
  e.target.disabled = true;
  for (const ep of ENDPOINTS.filter((x) => x.safe)) await ep._run();
  e.target.disabled = false;
};

document.getElementById("expand").onclick = () =>
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("open"));
</script>
</body>
</html>
