<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starter · OpenAI + ElevenLabs</title>
<style>
  :root {
    --bg: #10100f; --panel: #1a1a18; --line: #2e2e2a;
    --ink: #edeae2; --dim: #8b8880; --live: #b8e02c; --warn: #e0642c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 48px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 20px; }
  .sub a { color: var(--live); }
  .status { display: flex; gap: 16px; font-size: 12px; color: var(--dim); margin-bottom: 20px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: var(--live); }
  textarea {
    width: 100%; min-height: 88px; padding: 12px; resize: vertical;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    padding: 9px 16px; border-radius: 6px; cursor: pointer;
    background: var(--live); color: #10100f; border: 0; font: inherit; font-weight: 600;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.rec { background: var(--warn); color: #10100f; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .out {
    margin-top: 20px; padding: 14px; min-height: 56px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 2px solid var(--live); border-radius: 6px; white-space: pre-wrap;
  }
  .out.error { border-left-color: var(--warn); color: #f0b9a0; }
  audio { width: 100%; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>starter kit</h1>
  <p class="sub">Type or speak → OpenAI answers → ElevenLabs reads it back &nbsp;·&nbsp; <a href="/test.html">API console</a></p>

  <div class="status">
    <span><span class="dot" id="d-openai"></span>OpenAI</span>
    <span><span class="dot" id="d-eleven"></span>ElevenLabs</span>
    <span id="model"></span>
  </div>

  <textarea id="input" placeholder="Type something…">Explain the difference between an SLO and an SLA.</textarea>

  <div class="row">
    <button id="run">Ask and speak</button>
    <button id="textonly" class="ghost">Text only</button>
    <button id="mic" class="ghost">🎙 Record</button>
    <button id="reset" class="ghost">Clear history</button>
  </div>

  <div class="out" id="out">Your result will appear here.</div>
  <audio id="player" controls hidden></audio>
</main>

<script>
const $ = (id) => document.getElementById(id);
const out = $("out"), player = $("player");

// Multi-turn memory. Cleared by the reset button; swap for a store if you need
// it to survive reloads.
let history = [];

function show(text, isError = false) {
  out.textContent = text;
  out.classList.toggle("error", isError);
}

function busy(on) {
  $("run").disabled = $("textonly").disabled = $("mic").disabled = on;
}

fetch("/api/health").then(r => r.json()).then(h => {
  $("d-openai").classList.toggle("on", h.openai);
  $("d-eleven").classList.toggle("on", h.elevenlabs);
  $("model").textContent = h.models?.chat ?? "";
}).catch(() => show("The server did not respond. Check that it is running.", true));

async function ask(withVoice) {
  const message = $("input").value.trim();
  if (!message) return show("Enter a message first.", true);

  busy(true);
  player.hidden = true;
  show("Thinking…");

  try {
    history.push({ role: "user", content: message });

    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.detail || data.error);
    }

    const reply = await streamReply(r.body);
    if (!reply) throw new Error("Empty response from the model.");
    history.push({ role: "assistant", content: reply });

    if (withVoice) await speak(reply);
  } catch (err) {
    history.pop(); // don't keep a turn that failed
    show(String(err.message || err), true);
  } finally {
    busy(false);
  }
}

// Renders OpenAI's SSE token stream as it arrives rather than waiting for the
// whole reply — this is what makes the demo feel instant.
async function streamReply(body) {
  const reader = body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", reply = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data: ")) continue;
      const payload = line.slice(6).trim();
      if (payload === "[DONE]") continue;
      try {
        const delta = JSON.parse(payload).choices?.[0]?.delta?.content;
        if (delta) { reply += delta; show(reply); }
      } catch { /* partial chunk or keepalive line — ignore */ }
    }
  }
  return reply;
}

async function speak(text) {
  const r = await fetch("/api/speak", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  if (!r.ok) {
    const data = await r.json().catch(() => ({}));
    throw new Error(data.detail || data.error || "Failed to generate audio.");
  }
  player.src = URL.createObjectURL(await r.blob());
  player.hidden = false;
  player.play().catch(() => {});
}

// --- voice input: record → /api/listen → drop the transcript into the box ---
let recorder = null;
$("mic").onclick = async () => {
  if (recorder?.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      $("mic").textContent = "🎙 Record";
      $("mic").classList.remove("rec");
      show("Transcribing…");
      try {
        const blob = new Blob(chunks, { type: recorder.mimeType });
        const r = await fetch("/api/listen", {
          method: "POST",
          headers: { "Content-Type": blob.type || "audio/webm" },
          body: blob,
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || data.error);
        $("input").value = data.text || "";
        show(data.text ? "Transcribed. Press “Ask and speak”." : "Nothing was heard.", !data.text);
      } catch (err) {
        show(String(err.message || err), true);
      }
    };
    recorder.start();
    $("mic").textContent = "⏹ Stop";
    $("mic").classList.add("rec");
    show("Recording… press stop when done.");
  } catch (err) {
    show("Microphone unavailable: " + err.message, true);
  }
};

$("run").onclick = () => ask(true);
$("textonly").onclick = () => ask(false);
$("reset").onclick = () => { history = []; show("History cleared."); };
</script>
</body>
</html>
